[package]
name = "documind"
version = "1.0.0"
description = "DocuMind: chat with your documents, on your own computer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
tokio = { version = "1", features = ["time"] }
