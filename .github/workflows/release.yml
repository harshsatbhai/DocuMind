# Builds DocuMind installers for macOS (Apple Silicon + Intel), Windows and Linux, and publishes
# them to a GitHub Release. The download website reads the latest release from here.
#
# To release: bump "version" in frontend/src-tauri/tauri.conf.json, commit, then
#   git tag v1.0.0 && git push origin v1.0.0
# (or run it by hand: GitHub > Actions > "Release DocuMind" > Run workflow)
name: Release DocuMind

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # Apple Silicon (M1 and newer)
            target: aarch64-apple-darwin
            python-arch: arm64
            args: --target aarch64-apple-darwin
          - platform: macos-latest          # Intel Macs: x64 Python under Rosetta builds an Intel backend
            target: x86_64-apple-darwin
            python-arch: x64
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            python-arch: x64
            args: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python-arch: x64
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build the DocuMind engine (Python backend)
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt
          python scripts/build_backend.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build installers and upload to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./frontend
          tagName: v__VERSION__
          releaseName: DocuMind v__VERSION__
          releaseBody: Download the installer for your computer from https://documind-desktop.onrender.com or the assets below.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
