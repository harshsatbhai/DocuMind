services:
  - type: web
    name: rag-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
      - key: NVIDIA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: rag-frontend
    runtime: static # Changed to static site
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://rag-backend.onrender.com # Replace with your actual backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # DocuMind download website (static). Installers come from GitHub Releases,
  # built by .github/workflows/release.yml.
  - type: web
    name: documind-website
    runtime: static
    buildCommand: echo "No build step"
    staticPublishPath: ./website
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

databases:
  - name: rag-db
    plan: free
    databaseName: ragdb
    user: raguser 